name: Build & Deploy

on:
  push:
    branches: [main]
  # 배포만 다시 돌리고 싶을 때 Actions 탭에서 직접 실행
  workflow_dispatch:

# GitHub Pages 배포 권한
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.ghpages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Next.js 정적 빌드 (SSG) + portfolio.txt / sitemap.xml / robots.txt 생성
      # 타입 검사가 Node 기본 힙(약 2GB)을 넘겨 죽는 일이 있어 한도를 4GB로 올린다.
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # ── GitHub Pages 배포 ──
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: ghpages
        uses: actions/deploy-pages@v4

      # ── Vercel 배포 ──
      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -r out/* .vercel/output/static/
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/404.html" }
            ]
          }
          EOF

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
